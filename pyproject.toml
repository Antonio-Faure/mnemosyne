[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemosyne"
version = "0.1.0"
description = "Autonomous heartbeat agent that discovers, connects and aggregates historical image archive providers into a unified API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Antonio-Faure" }]
keywords = ["archives", "images", "iiif", "glam", "autonomous-agent", "aggregation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "PyYAML>=6.0",
    "cryptography>=43.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
browser = [
    "stirrup[browser]",
    "openai>=1.40",
]
media = [
    "Pillow>=10.4",
    "imagehash>=4.3",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
mnemosyne = "mnemosyne.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
