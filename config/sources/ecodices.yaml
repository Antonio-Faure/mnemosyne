id: ecodices
name: e-codices — Virtual Manuscript Library of Switzerland
institution: e-codices (University of Fribourg)
country: CH
protocol: iiif
base_url: https://www.e-codices.unifr.ch
auth: none
license: "https://creativecommons.org/licenses/by-nc/4.0/"
rights: "CC BY-NC — e-codices"
enabled: false   # CC BY-NC 4.0 (usage non commercial) — activer si la politique du projet l'autorise
rate_limit_per_s: 1.0
priority: 40
tags: [university-library, switzerland, manuscripts, iiif, keyless]
seeds:
  - "Handschrift"
  - "codex"
notes: >-
  IIIF entry point is a Collection manifest: metadata/iiif/collection/<library>.json
  enumerates a library's per-manuscript Presentation manifests served at
  metadata/iiif/<shelfmark>/manifest.json (e.g. csg-0857). Onboarded as a
  collection-based IIIF source via the generic iiif.py connector, which walks
  the v2 `sc:Collection.manifests` list. Keyless. Rights: CC BY-NC.
extra:
  collection: https://www.e-codices.unifr.ch/metadata/iiif/collection/csg.json
  collection_id: "csg"
