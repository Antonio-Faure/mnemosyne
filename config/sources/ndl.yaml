notes: >-
  Per-object IIIF Presentation v2 manifests
  (https://dl.ndl.go.jp/api/iiif/<pid>/manifest.json) whose images are served by
  the IIIF Image API (https://dl.ndl.go.jp/api/iiif/<pid>/<image-id>, info.json
  confirmed, level1). The host exposes no aggregate IIIF entry point: probes for
  collection/manifest.json, manifest.json, collection.json,
  collection/collection.json, collections/manifest.json and <pid>/collection.json
  all return 404, and no IIIF search endpoint is published, so a single-manifest
  entry point is used (as for bsb, llgc, colenda). Onboarded via the generic
  src/mnemosyne/sources/iiif.py connector (v2
  sequences/canvases/images/resource); no bespoke connector needed. Metadata
  carries Title/Creator/Publication Date and Access Restrictions (PDM). Keyless.
  The manifest `license` points at the NDL IIIF-API terms of use
  (help_iiif#api-の利用について); per-notice rights live under
  `Access Restrictions`.
