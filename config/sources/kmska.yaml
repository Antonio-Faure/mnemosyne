notes: >-
  IIIF entry point is a Collection manifest. The host runs Imagehub (Vlaamse
  Kunstcollectie), a IIIF Presentation API aggregator backed by Cantaloupe for
  the IIIF Image API. The top-level collection at iiif/2/collection/manifest.json
  (label "Top Level Collection for Imagehub", viewingHint top) enumerates every
  Presentation v2 sc:Manifest available on the instance — per-object manifests at
  iiif/2/<id>/manifest.json (e.g. iiif/2/10741/manifest.json). Onboarded as a
  collection-based IIIF source via the generic iiif.py connector, which walks the
  v2 `sc:Collection.manifests` list. Keyless. Rights: Public Domain Mark 1.0
  (CC0) — Royal Museum of Fine Arts Antwerp - Flemish Community.
extra:
