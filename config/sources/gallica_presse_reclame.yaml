notes: >-
  Frère ciblé du connecteur `gallica` générique : même API officielle SRU
  (Dublin Core) + images via IIIF, aucun scraping HTML. La requête CQL
  restreint la recherche à la facette « Type de document » (photographie /
  affiche / estampe) et à la fenêtre 1919-1935, pour faire remonter la presse
  photographique (Agence Rol, Agence Meurisse) et la réclame publicitaire
  (affiches, dont Citroën / Tour Eiffel illuminée 1925, département des
  Estampes) que le connecteur générique noie sous les livres et périodiques.
  Licences Gallica par objet (domaine public / sous licence) : `dc:rights` est
  reporté dans `Asset.rights`, aucune image n'est écartée a priori sur le droit.
  Constat 2026-11-08 : `https://gallica.bnf.fr/SRU` renvoie HTTP 403 (page WAF
  Cloudflare « Sorry, you have been blocked ») depuis cette IP, comme pour
  `gallica` — blocage infrastructurel IP/ASN, PAS un bug de chemin/requête ; le
  connecteur SRU/IIIF est correct et prêt. Source ACTIVE mais signalée
  « indisponible depuis cette IP (Cloudflare) » ; ne pas modifier le code au
  hasard (voir docs/SOURCES.md).
