id: atlanta
name: "Atlanta History Center — Album"
institution: Atlanta History Center
country: US
protocol: rest
base_url: https://album.atlantahistorycenter.com
auth: none
license: "PDM-1.0 / CC0-1.0 / CC-BY-4.0"
rights: "Droits explicites par notice (NoC-US / Public Domain / CC0 / CC BY) ; le connecteur CONTENTdm rejette InC, CNE, droits réservés et restrictions non commerciales."
rate_limit_per_s: 1.0
priority: 59
tags: [museum, history, atlanta, georgia, keyless, public-domain, contentdm]
seeds: ["steam engine", "railroad", "building", "map", "street", "civil war", "portrait", "aerial"]
notes: >-
  CONTENTdm (Atlanta History Center — Album photographique) — API JSON officielle
  sans clé. Recherche cross-collection : GET
  {base}/digital/api/search/searchterm/<query url-encodé>?maxRecords=10&start=<offset>
  (10 items par page ; pagination par `start`, arrêt sur limite / totalResults /
  page vide ; max_pages défaut 3). Détail d'un item : GET
  {base}/digital/api/singleitem/collection/<alias>/id/<id> pour lire
  contentType/imageUri et la liste `fields`. Filtre image : ne garder que
  contentType `image/*` avec imageUri non vide (http(s) absolu ou chemin « / »).
  Filtre droits explicite par notice sur les champs rights/copyright (accepte
  « No copyright - United States » / NoC-US / Public Domain / CC0 / CC BY ;
  rejette « not evaluated », « undetermined », « all rights reserved »,
  « In Copyright », CC BY-NC/ND…). Images via IIIF
  https://album.atlantahistorycenter.com/iiif/2/<alias>:<id>/full/!1200,1200/0/default.jpg
  (image) et /full/!400,400/0/ (vignette). page_url via itemLink. Aucune image
  téléchargée, aucun scraping HTML, pas de clé, rate limit poli 1.0 req/s.
