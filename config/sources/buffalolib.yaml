  Check per record.
enabled: false   # licence restrictive (usage non commercial / autorisation ecrite) — activer si la politique du projet l'autorise
rate_limit_per_s: 1.0
priority: 45
tags: [library, usa, manuscripts, iiif, keyless, omeka]
seeds:
