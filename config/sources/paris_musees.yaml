tags: [museum, france, iiif, keyless]
notes: >-
  Les collections des musées de la Ville de Paris (Paris Musées) exposent un
  service IIIF Presentation v2 : un manifeste par notice à
  apicollections.parismusees.paris.fr/iiif/<id>/manifest. Aucune Collection IIIF
  n'est publiée et l'API de recherche (GraphQL /graphql) exige un jeton (auth:
  none ne suffit pas) — la source est donc onboardée comme manifeste unique via
  le connecteur générique iiif.py (v2 sequences/canvases/images/resource).
  Keyless. Droits variables selon la notice (majorité domaine public).
