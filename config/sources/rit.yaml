notes: >-
  Keyless IIIF. RIT's digital collections run on the Luna image server, which
  exposes per-object IIIF Presentation v2 manifests at
  /luna/servlet/iiif/m/<object-id>/manifest. Probes for an aggregate IIIF
  Collection manifest (/iiif/collection/..., /iiif/collection/top,
  /iiif/collection) return the Luna HTML web UI or 404, so no Collection entry
  point exists. Onboarded as a single-manifest IIIF source: the generic
  src/mnemosyne/sources/iiif.py connector consumes the manifest declared in
  `extra.manifest` and normalizes its first canvas image. Sample object:
  "Bible" (Cary Graphic Arts Collection). Single-object source: `seeds` are
  meaningful only for future multi-object expansion.
