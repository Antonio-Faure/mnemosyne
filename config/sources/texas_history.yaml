notes: >-
  Le Portal to Texas History (UNT Libraries) agrège des documents numérisés du
  Texas : journaux, livres, cartes et fonds photographiques, dont ceux du Permian
  Basin Petroleum Museum (industrie pétrolière, Odessa / bassin permien). La
  recherche par mot-clé est protégée par un défi anti-bot « Altcha »
  (proof-of-work servi même pour `format=json`) ; la politique « pas de scraping »
  interdit de le contourner, et l'OAI-PMH (clé libre, ouvert) n'offre pas de
  recherche par mot-clé. Le connecteur s'appuie donc sur une liste curatée de
  `seeds` (ARK) résolue via le chemin programmatique IIIF Presentation v2
  (un manifeste par ARK : https://texashistory.unt.edu/ark:/67531/{ark}/manifest/).
  Les images portent un service IIIF Image API v2 level2 ; les champs `rights` /
  `rights.license` du manifeste donnent la licence. Voir
  `src/mnemosyne/sources/texas_history.py`.
extra:
  ark_naan: "67531"
  manifest_pattern: "https://texashistory.unt.edu/ark:/67531/{ark}/manifest/"
  notice_pattern: "https://texashistory.unt.edu/ark:/67531/{ark}/"
  attribution: The Portal to Texas History (UNT Libraries)
  image_size: "!1200,1200"
  thumbnail_size: "!400,400"
