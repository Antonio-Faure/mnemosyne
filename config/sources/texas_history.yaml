id: texas_history
name: The Portal to Texas History (UNT)
institution: University of North Texas Libraries
country: US
protocol: iiif
base_url: https://texashistory.unt.edu
auth: none
license: >-
  Domaine public ou licence Creative Commons selon l'item (champ `rights` /
  `rights.license` du manifeste IIIF) ; conditions générales :
  https://texashistory.unt.edu/terms-of-use/
rights: >-
  Citation de l'institution partenaire et du Portal to Texas History (attribution
  fournie par chaque manifeste). Politique « pas de scraping » : la recherche
  HTML est protégée par un anti-bot Altcha.
rate_limit_per_s: 1.0
priority: 60
tags: [portal-texas-history, unt, texas, us, oil-industry, petroleum, permian-basin, iiif, keyless]
