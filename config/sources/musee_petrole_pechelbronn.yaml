notes: >-
  Photothèque du Musée français du Pétrole (Merkwiller-Pechelbronn, Bas-Rhin),
  berceau du pétrole français (~18e–1970) : puits, chevalements/derricks,
  installations de forage, raffineries, torchères, cartes postales, figures.
  Accès 100 % programmatique à l'API REST WordPress ouverte
  `wp-json/wp/v2/media` (JSON, sans clé ; ~1109 médias ; per_page max 100 ;
  filtrage image côté client car `mime_type` n'est pas filtré côté serveur ;
  titres dérivés des noms de fichiers, caption/alt/description VIDES, pas de
  photographe ni de date d'origine ni de champ droits).
  BLOCAGE DROITS / DÉSACTIVÉE : surface « tous droits réservés »
  (musee-du-petrole.com mentions légales « © Musée du Pétrole » ; portail
  WebMuseo du Parc naturel régional des Vosges du Nord : reproduction/
  représentation interdite). Aucune licence libre, aucune réutilisation ni
  ré-hébergement sans autorisation écrite du musée. Le portail catalogue
  inventorié WebMuseo (`/app/collection/*`) renvoie HTTP 403 (mur anti-bot) et
  n'expose PAS d'OAI-PMH. La source reste DÉSACTIVÉE tant que (a) le musée — qui
  est FERMÉ — n'a pas rouvert et (b) aucune autorisation écrite + licence de
  réutilisation (CC BY / CC BY-SA 4.0 ou domaine public) n'a été accordée ;
  connecteur + tests prêts. État au 2026-11-08 : décision opérateur
  (20:30) = attendre la réouverture du musée, maintenir la source désactivée ;
  le suivi du contact est pris en charge par la tâche #197 (message corrigé,
  adresse vivante du Parc, signature anonyme, demande de rendez-vous) ; cette
  tâche n'envoie AUCUN e-mail et ne réutilise AUCUNE adresse morte. Historique
  des tentatives : e-mail museedupetrole@wanadoo.fr = HTTP/SMTP 550
  « destinataire invalide » (MORT) ; musee.petrole@musees-vosges-nord.org =
  domaine mail cassé (MORT) ; seul contact@parc-vosges-nord.fr a été délivré.
  Activation = changement d'une ligne (`enabled: true` + licence CC/DP) dès
  réception de l'autorisation.
