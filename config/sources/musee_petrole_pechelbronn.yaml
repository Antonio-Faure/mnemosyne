notes: >-
  Photothèque du Musée français du Pétrole (Merkwiller-Pechelbronn, Bas-Rhin),
  berceau du pétrole français (~18e–1970) : puits, chevalements/derricks,
  installations de forage, raffineries, torchères, cartes postales, figures.
  Accès 100 % programmatique à l'API REST WordPress ouverte
  `wp-json/wp/v2/media` (JSON, sans clé ; ~1109 médias ; per_page max 100 ;
  filtrage image côté client car `mime_type` n'est pas filtré côté serveur ;
  titres dérivés des noms de fichiers, caption/alt/description VIDES, pas de
  photographe ni de date d'origine ni de champ droits).
  DÉSACTIVÉE : la source n'est ajoutée que si le musée confirme un accès
  programmatique (API/IIIF/OAI-PMH ou autorisation de lire les pages publiques).
  Aucune réutilisation d'images : le projet ne copie, n'héberge, ne redistribue
  et ne revend rien. Le portail WebMuseo (`/app/collection/*`) renvoie HTTP 403
  et n'expose pas d'OAI-PMH. Connecteur + tests prêts : l'activation est un
  changement d'une ligne (`enabled: true`) après réponse positive du musée.
  Prise de contact du 2026-11-08 : demande d'accès programmatique (pas de
  réutilisation) ; museedupetrole@wanadoo.fr = 550, musee.petrole@... = domaine
  cassé, seul contact@parc-vosges-nord.fr délivré ; formulaire avec accusé ;
  aucune réponse à ce jour. Si le musée refuse l'accès, la source n'est pas
  ajoutée.
extra:
  media_endpoint: /media
  per_page_max: 100
  access_request:
    sender: "<adresse e-mail de l'agent>"
    to: museedupetrole@wanadoo.fr
    cc: [musee.petrole@musees-vosges-nord.org, contact@parc-vosges-nord.fr]
    sent: "2026-11-08"
    status: "pending"
    question: "programmatic access: yes/no"
  hero_media_ids: [1436, 4285, 1092, 4380, 4125]
