notes: >-
  Photothèque du Musée français du Pétrole (Merkwiller-Pechelbronn, Bas-Rhin),
  berceau du pétrole français (~18e–1970) : puits, chevalements/derricks,
  installations de forage, raffineries, torchères, cartes postales, figures.
  Accès 100 % programmatique à l'API REST WordPress ouverte
  `wp-json/wp/v2/media` (JSON, sans clé ; ~1109 médias ; per_page max 100 ;
  filtrage image côté client car `mime_type` n'est pas filtré côté serveur ;
  titres dérivés des noms de fichiers, caption/alt/description VIDES, pas de
  photographe ni de date d'origine ni de champ droits).
  DÉSACTIVÉE : surface « tous droits réservés » (musee-du-petrole.com mentions
  légales « © Musée du Pétrole » ; portail WebMuseo du Parc naturel régional des
  Vosges du Nord : reproduction/représentation interdite). Aucune réutilisation
  libre ni ré-hébergement sans autorisation écrite du musée ; le portail
  catalogue inventorié WebMuseo (`/app/collection/*`) renvoie HTTP 403 (mur
  anti-bot) et n'expose PAS d'OAI-PMH. Connecteur + tests prêts : l'activation
  est un changement d'une ligne (`enabled: true` + licence CC/DP) dès réception
  de l'autorisation (demande e-mail envoyée le 2026-11-08 par l'agent navigateur,
  en attente).
extra:
