notes: >-
  Archives photographiques de l'Institut français du pétrole (fondé 1944) :
  exploitation pétrolière en France (Parentis-en-Born, Lacq, bassin parisien)
  et services mobiles de forage/carottage type Schlumberger. Recon du
  2026-11-08 : IFPEN n'expose AUCUNE archive photographique publique ni API.
  Site officiel ifpenergiesnouvelles.fr = CMS Drupal corporate ; /phototheque,
  /mediatheque, /medias, /phototheque-historique, /notre-histoire, /histoire,
  /patrimoine, /galerie-photos renvoient tous 404 ; seule « archive » = HAL-IFP
  (publications scientifiques, pas de photos) ; surfaces média = /tags/videos,
  /tags/communiques-presse (corporate). Pas de IIIF, pas d'API JSON.
  FranceArchives (fiche autorité IFP, agent/794087623) ne renvoie que du
  bâti/urbanisme (CAPA « Immeubles de bureaux et laboratoires pour l'IFP ») ;
  POP (« pétrole »=lampes, « Lacq »=usines à gaz) et ANMT Roubaix (charbon /
  finance) n'ont pas de fonds d'exploitation pétrolière. DÉSACTIVÉE : aucune
  matière à normaliser ; le connecteur (sources/ifpen_petrole.py) est inerte et
  ne fait aucun appel réseau. L'imagerie pétrolière française réellement
  disponible est servie par la source sœur `ia_esso_petrole` (corpus ESSO
  France, Internet Archive). Réactiver IFPEN = changement d'une ligne dès qu'un
  endpoint public ou une autorisation écrite de réutilisation de la photothèque
  historique est obtenu (voir docs/OUTREACH.md).
