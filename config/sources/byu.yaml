id: byu
name: BYU Digital Collections
institution: Brigham Young University
country: US
protocol: rest
base_url: https://contentdm.lib.byu.edu
auth: none
license: "PDM-1.0 / CC0-1.0 / CC-BY-4.0"
rights: "No copyright - United States / Public Domain par notice ; filtre explicite sur les champs rights/copyright"
rate_limit_per_s: 1.0
priority: 58
tags: [university, utah, keyless, public-domain, contentdm]
seeds:
  - "steam engine"
