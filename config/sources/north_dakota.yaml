notes: >-
  CONTENTdm (North Dakota Digital Horizons, North Dakota State Library / NDSU
  Libraries) — API JSON officielle sans clé. Recherche cross-collection : GET
  {base}/digital/api/search/searchterm/<query url-encodé>?maxRecords=10&start=<offset>
  (10 items par page ; pagination par `start`, arrêt sur limite / totalResults /
  page vide ; max_pages défaut 3). Détail d'un item : GET
  {base}/digital/api/singleitem/collection/<alias>/id/<id> pour lire
  contentType/imageUri et la liste `fields`. Filtre image : ne garder que
  contentType `image/*` avec imageUri non vide (http(s) absolu ou chemin « / »).
  Filtre droits explicite par notice sur les champs rights/copyright (accepte
  « In public domain. » / Public Domain / NoC-US / CC0 / CC BY ; rejette
  « In Copyright », « Copyright held by the University Archives. », CNE, droits
  réservés et restrictions non commerciales CC BY-NC/ND). Images via IIIF
  https://<base>/iiif/2/<alias>:<id>/full/!1200,1200/0/default.jpg (image) et
  /full/!400,400/0/ (vignette). page_url via itemLink, comme les autres
  CONTENTdm. Aucune image téléchargée, aucun scraping HTML, pas de clé, rate
  limit poli 1.0 req/s.
