extra:
  api_path: "/visualizer/api"
  ark_naan: "14707"
  attribution: "La Contemporaine / L'Argonnaute"
  access_model: "json_per_document (arkName + uuid) ; pas de IIIF ; pas d'API de recherche"
  coverage_note: >-
    Fonds « France, entre-deux-guerres 1918-1939. Photographies » de La
    Contemporaine (cotes PH C4/PH C6) : grèves et mouvements sociaux des années
    1930 en Île-de-France — grève des transports (1938), grève des taxis (1933),
    grève de la batellerie / des bateliers (1936), manifestation du Front
    populaire (1938), marcheurs de la faim (1933) — plus une photo d'usine
    Citroën (Javel, 1915, Albums Valois). Pas de photographie isolée « ouvriers
    Citroën / grève Javel 1936 » : le fonds Citroën des années 1930 n'est pas
    décrit par une légende de presse. Couverture volontairement honnête pour le
    Résolveur : la valeur réelle est « grèves / histoire sociale 1930s en
    Île-de-France », pas « usines Citroën ».
  relevance_note: >-
    Pas de recherche côté source : search() filtre la liste curatée par
    recouvrement lexical (titre, description, mots-clés, cote, date), rendu
    tolérant aux pluriels (grèves=grève) et à la décennie (une année 1930
    vaut pour 1930-1939) afin que les phrases du Résolveur retrouvent les
    photos de grèves 1930s. Sans aucun recouvrement, un seed est écarté
    (aucune fuite vers des recherches hors-sujet).
notes: >-
  API JSON PAR DOCUMENT uniquement : /visualizer/api?arkName=<ARK>&uuid=<UUID>
  renvoie media[0].record{title, referenceCode, description, period.boundaries,
  locationKeywords} + media[0].location{original, thumb, iiif:null}. PAS de IIIF
  (isIIIFEnabled=false), PAS d'API de recherche JSON (aucun index public). Faute
  de recherche programmatique, la découverte passe par une liste `seeds` curatée
  (une URL notice/média par photo). Aucun scraping HTML ni contournement d'anti-bot
  (règle dure ; cf. docs/SOURCE-LA-CONTEMPORAINE.md) : le service expose un accès
  programmatique (cette API JSON), c'est lui qui est utilisé. Images servies en
  direct par l'institution (/images/<UUID>.jpg) — hotlink, aucune copie. robots.txt :
  seuls /private/, /oai-pmh, /user/ sont interdits ; l'User-Agent descriptif du
  projet (mnemosyne) n'est pas dans la liste des robots bloqués. OAI-PMH interdit
  par robots.txt et trop pauvre (identifiants seuls). Licences : Licence Ouverte
  (domaine public) sinon « tous droits réservés » — renvoyer à la notice. Les
  seeds ont été vérifiés en direct (API /visualizer/api, HTTP 200, JSON conforme).
