notes: >-
  Per-object IIIF Presentation v2 manifests served by the eMuseum backend at
  /apis/iiif/presentation/v2/1-objects-<id>/manifest — the /mirador/objects/<id>
  viewer page (sample 91683) references it. Probes for an aggregate Collection
  manifest (1-collection, 1-collections, collections-<id>, presentation/v2 root)
  return 400/404, so a single-manifest entry point is used via the generic
  src/mnemosyne/sources/iiif.py connector. Keyless. Rights: the sampled manifest
  carries "© Bildrecht, Wien" (droits réservés), hence disabled by default.
