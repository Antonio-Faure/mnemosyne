notes: >-
  IIIF Presentation v2 manifests are served per item by the Penn Libraries
  digital repository. The friendly entry point is
  https://colenda.library.upenn.edu/items/ark:/81431/<id>/manifest (its @id
  resolves to digitalrepository.library.upenn.edu/iiif/2/items/<uuid>/manifest).
  The host exposes no aggregate IIIF Collection manifest (probes for
  /iiif/collection and /collections/manifest return 404), so a single-manifest
  entry point is used with the generic src/mnemosyne/sources/iiif.py connector.
  Keyless. Metadata carries Title/Date/Rights and the first canvas image is
  served via the IIIF Image API (iiif-images.library.upenn.edu). Rights vary per
  notice.
