notes: >-
  IIIF Presentation API v2 host: Nationalmuseum Sweden's collection hosted on
  Klokan Technologies' iiifhosting.com (nationalmuseumse.iiifhosting.com).
  Manifests are served per object at /iiif/<sha256-id>/manifest.json and the
  image is served by the IIIF Image API at the same path. The host exposes no
  enumerable Collection manifest or search endpoint (the account root is a
  Firebase auth page; /iiif/collection.json and /iiif/manifest.json return
  HTTP 400, /iiif/collection/manifest.json returns HTTP 404), so it is
  onboarded as a single-manifest IIIF source through the generic iiif.py
  connector. Keyless.
