  (infrastructurel), PAS un bug de chemin/requête — le connecteur est correct.
  Source laissée ACTIVE mais signalée « indisponible depuis cette IP (Cloudflare) » ;
  ne pas modifier le code au hasard (voir docs/SOURCES.md).
