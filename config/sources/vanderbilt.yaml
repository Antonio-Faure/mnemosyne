notes: >-
  Per-object IIIF Presentation v2 manifests served by the Vanderbilt University
  Libraries manifest host, e.g.
  https://iiif-manifest.library.vanderbilt.edu/gallery/1994/1994.538g.json
  (pattern: /gallery/<year>/<accession>.json). The host is a static manifest
  store: the root and every aggregate path probed (collection.json,
  manifests.json, index.json, top.json, all.json) return HTTP 403, so no
  aggregate IIIF Collection is exposed — a single-manifest entry point is used.
  Images are served by the Cantaloupe 5 IIIF Image API at
  https://iiif.library.vanderbilt.edu/iiif/2/ (identifiers such as
  gallery/1994/1994.538g.tif). The generic
  src/mnemosyne/sources/iiif.py connector normalizes the first canvas image;
  metadata carries Artist / Accession Number / Creation Year / Title.
