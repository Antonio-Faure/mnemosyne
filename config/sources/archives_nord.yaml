id: archives_nord
name: Archives départementales du Nord
institution: Archives départementales du Nord (Département du Nord)
country: FR
protocol: rest
base_url: https://archivesdepartementales.lenord.fr
auth: none
license: "Restrictive — délibération CD Nord du 27/03/2017"
rights: >-
  Réutilisation des informations publiques — délibération du Conseil
  départemental du Nord du 27 mars 2017. La réutilisation COMMERCIALE des
  informations publiques issues des opérations de numérisation est soumise au
  paiement d'une redevance et à la souscription d'une licence écrite (demande
  écrite à effectuer). Toute autre réutilisation est gratuite, avec obligation
  de citer la source (Archives départementales du Nord, cote) et de ne pas
  altérer les documents. → Numérisations : restrictif (réutilisation commerciale
  interdite sans licence).
rate_limit_per_s: 1.0
priority: 90
tags: [archives, france, nord, industrial-heritage, textile, mines, metallurgy, ark, no-iiif]
seeds:
  - "mines"
  - "textile"
  - "métallurgie"
  - "usine"
  - "chemin de fer"
enabled: false
notes: >-
  Plateforme Arkothèque / Mnesys (ARK NAAN 33518). Pas de IIIF (location.iiif
  toujours null) ni d'OAI-PMH (/oai-pmh → 404). Le contenu (médias, URLs
  d'images, licence) passe par l'API JSON programmatique /visualizer/api ; la
  recherche (/search/results) est rendue côté serveur. Désactivé : licence
  restrictive — la réutilisation commerciale des numérisations est soumise à
  redevance + licence écrite (délibération CD Nord du 27/03/2017).
extra:
  ark_naan: 33518
  search_url: https://archivesdepartementales.lenord.fr/search/results
  visualizer_api: https://archivesdepartementales.lenord.fr/visualizer/api
  image_url_template: https://archivesdepartementales.lenord.fr/images/{uuid}.jpg
  thumbnail_url_template: https://archivesdepartementales.lenord.fr/images/{uuid}_thumbnail.jpg
  license_page: https://archivesdepartementales.lenord.fr/page/reutilisation-des-informations-publiques
  iiif: false
  oai_pmh: false
