rights: "Droits explicites par notice (« This item is in the public domain. » / NoC-US / CC0 / CC BY) ; le connecteur CONTENTdm rejette « Copyright the American University in Cairo » + contact permissions, InC, droits réservés et restrictions non commerciales des collections photographiques récentes."
