notes: >-
  Per-object IIIF Presentation v2 manifests
  (https://damsssl.llgc.org.uk/iiif/2.0/<id>/manifest.json) whose images are
  served by the IIIF Image API at
  https://damsssl.llgc.org.uk/iiif/2.0/image/<id> (info.json confirmed). The
  host exposes no aggregate IIIF entry point: probes for collection.json,
  collections and collection/<id> all return 404, and no IIIF search endpoint is
  published, so a single-manifest entry point is used (as for albertina). The
  DAMS rewrites to the canonical IIIF host iiif.llyfrgell.cymru. Onboarded via
  the generic src/mnemosyne/sources/iiif.py connector (v2
  sequences/canvases/images/resource); no bespoke connector needed. Metadata
  carries Title/Author/Date; rights are Public Domain Mark 1.0.
