id: iwm_ww1
name: Imperial War Museums — WW1 official photography (Q series, via Wikimedia Commons)
institution: Imperial War Museums (IWM), London
country: GB
protocol: rest
base_url: https://commons.wikimedia.org/w/api.php
auth: none
license: "Public domain"
rights: "© IWM — WW1 Q-series scans are Public Domain (via Wikimedia Commons); attribute « © IWM (Q xxxx) » and link the Commons file page (source_page)"
rate_limit_per_s: 0.5
priority: 25
tags: [ww1, photography, museum, britain, keyless, wikimedia-commons]
seeds:
  - "trench Western Front"
  - "Belgian refugees 1914"
