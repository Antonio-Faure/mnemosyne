# mnemosyne global configuration.
# Secrets live in .env, never here.

app:
  data_dir: data
  vault_path: vault/vault.enc
  journal_dir: journal
  control_dir: control
  log_level: INFO

api:
  host: 0.0.0.0
  port: 8080

heartbeat:
  tick_seconds: 15
  max_workers: 4
  # disjoncteur anti-freeze pour les jobs mécaniques SEULEMENT (bornés en
  # interne: httpx 30s/requête, boucles plafonnées — 1h est une large marge).
  # Les sessions d'agent (agency) n'ont JAMAIS de plafond de temps (jugées sur
  # le marqueur de patinage, pas sur l'horloge).
  job_timeout_s: 3600
  stale_lock_s: 18000   # > job_timeout_s : un job mécanique hangé est repris après 5h max

reputation:
  # ISO date the agent's own Google account was created — enables the warmup
  # phases (0 outbound for the first 3 days, then a gentle ramp-up).
  # null => no warmup (trusted/aged account).
  account_created_at: "2026-09-30"
  domain_min_interval_s: 1.0
  block_cooldown_s: 300
  warmup:
    - until_day: 3
      outbound_per_day: 0
      harvest_per_day: 50
    - until_day: 10
      outbound_per_day: 3
      harvest_per_day: 150
    - until_day: null
      outbound_per_day: 20
      harvest_per_day: 1000

llm:
  default: zen
  providers:
    zen:
      base_url: https://opencode.ai/zen/go/v1
      api_key_env: OPENCODE_API_KEY
      model: deepseek-v4.1-flash
      # Fall back to the token opencode caches after you log in to OpenCode Go.
      auth_provider: opencode-go

# Operator channel: agents ASK (ask_operator), you ANSWER (Telegram inline
# keyboards, one bot per agent; CLI fallback: `mnemosyne answer <task> "..."`).
# Tokens: env var, else the vault under the lowercased name
# (e.g. `mnemosyne vault set mnemosyne_coder_bot_token <token>`).
# A bot cannot message you before you press /start on it.
operator:
  enabled: false
  coder:
    bot_token_env: MNEMOSYNE_CODER_BOT_TOKEN
    chat_id: ""     # your Telegram chat id (see `mnemosyne telegram updates`)
  browser:
    bot_token_env: MNEMOSYNE_BROWSER_BOT_TOKEN
    chat_id: ""

# Public identity disclosed in every email / contact form (transparency).
identity:
  name: mnemosyne
  purpose: >-
    a free and open research project that aggregates public historical image
    archives so they are easier to find and reuse
  repo_url: https://github.com/Antonio-Faure/mnemosyne
  agent_email: archivist.mnemosyne@gmail.com
  language: fr

# P3: autonomous discovery of new providers.
discovery:
  enabled: true
  interval_s: 86400
  limit: 100

# Coder agent (bi-agent; also reachable via `mnemosyne agency --to coder`).
dev:
  max_turns: 120       # une connexion (lecture + connecteur + tests + PR) dépasse 40 tours
  read_max_chars: 3000
  list_max_entries: 60
  grep_max_chars: 2500
  fetch_max_chars: 3000
  # model: deepseek-v4.1-flash   # uncomment to use a cheaper model for dev

# Stirrup agent loop (bi-agent + warmup).
agents:
  max_turns: 400
  # injecte un tip anti-acharnement à 75 tours, puis tous les 50
  turn_tip_at: 75
  turn_tip_every: 50
  # Pas de plafond de TEMPS : une mission longue qui avance doit finir son travail.
  # On ne presse l'agent que s'il patine (aucune action distincte depuis
  # stall_after_s) ou s'il epuise ses tours (max_turns).
  stall_after_s: 900
  stall_repeat: 6
  # required by Stirrup; kept high so reasoning is not truncated
  max_tokens: 32768
  # le harness ne supprime jamais ses enregistrements (~37 Mo par session) :
  # on garde les N plus recents, purge au demarrage de chaque session navigateur
  recordings_keep: 8
  context_window_tokens: 128000
  output_dir: data/agent-runs
  warmup_max_turns: 40
  force_vision: true
  warmup_per_day_min: 1
  warmup_per_day_max: 2
  warmup_window_start: 8
  warmup_window_end: 23
  warmup_session_min: 6
  warmup_session_max: 12
  warmup_skip_probability: 0.2
  warmup_sites:
    - https://gallica.bnf.fr/
    - https://commons.wikimedia.org/wiki/Main_Page
    - https://archive.org/
    - https://www.europeana.eu/
    - https://fr.wikipedia.org/wiki/Histoire_de_l%27industrie
    - https://fr.wikipedia.org/wiki/P%C3%A9trole
    - https://www.ina.fr/

# Bounds the LLM context (and therefore the cost) of long-running agents.
notify:
  telegram:
    enabled: true
    bot_token_env: MNEMOSYNE_TELEGRAM_BOT_TOKEN
    chat_id_env: MNEMOSYNE_TELEGRAM_CHAT_ID

sources_dir: config/sources
