# The agent runs in a dedicated Chrome and must browse on the host's real
# (residential) network — never through Tailscale (see scripts/check-egress.sh).
#
# Chrome 154 only listens for CDP on 127.0.0.1 inside its own container, so
# `mnemosyne` shares Chrome's network namespace: it reaches CDP at
# 127.0.0.1:9222 directly. The API port is therefore published on the `chrome`
# service (the namespace owner).

services:
  chrome:
    build: docker/chrome
    image: mnemosyne-chrome:local
    shm_size: "1gb"
    environment:
      DISPLAY: ":99"
      CHROME_PROFILE_DIR: /profile
    # Keep DNS off the tailnet (no MagicDNS / tail*.ts.net search domain).
    dns:
      - 1.1.1.1
      - 9.9.9.9
    dns_search:
      - localdomain
    volumes:
      - ./data/chrome-profile:/profile
    ports:
      # Bind to loopback only: the profile is logged into the agent's Google
      # account and VNC has no password, so never expose these on the network.
      - "127.0.0.1:6080:6080"   # noVNC — human intervention
      - "127.0.0.1:8080:8080"   # mnemosyne API (shared namespace)
    restart: unless-stopped

  mnemosyne:
    build: .
    image: mnemosyne:local
    # Share Chrome's netns so browser-use reaches CDP on 127.0.0.1:9222.
    network_mode: "service:chrome"
    env_file:
      - .env
    environment:
      MNEMOSYNE_CONFIG: /app/config/config.yaml
      MNEMOSYNE_CDP_URL: http://127.0.0.1:9222
      MNEMOSYNE_BROWSER_ENABLED: "1"
      # Reuse the OpenCode Go token opencode caches after login (read-only mount).
      OPENCODE_AUTH_PATH: /opencode-auth/auth.json
    volumes:
      - ./data:/app/data
      - ./vault:/app/vault
      - ./journal:/app/journal
      - ./control:/app/control
      - ./config:/app/config:ro
      - ${HOME}/.local/share/opencode:/opencode-auth:ro
    depends_on:
      - chrome
    restart: unless-stopped
    command: ["mnemosyne", "run"]

# Fixed subnet so a host policy route can force this traffic onto the physical
# NIC (see scripts/check-egress.sh) and off any Tailscale exit node.
networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
