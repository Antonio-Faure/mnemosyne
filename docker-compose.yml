# Single container: the app AND a real Chrome (Xvfb + VNC + CDP) AND the
# browser-harness, all as uid 1000 — same filesystem, same user, one CDP owner.
# The agent's traffic must stay on the machine's real (residential) network,
# never through Tailscale (see scripts/check-egress.sh).

services:
  mnemosyne:
    build: .
    image: mnemosyne:local
    # uid 1000 keeps Chrome's sandbox enabled (no --no-sandbox) and matches the
    # host user, so data/, vault/ and the Chrome profile are shared cleanly.
    user: "1000:1000"
    # Chrome's sandbox needs user namespaces that Docker's default seccomp blocks.
    security_opt:
      - seccomp=unconfined
    env_file:
      - .env
    environment:
      MNEMOSYNE_CONFIG: /app/config/config.yaml
      OPENCODE_AUTH_PATH: /opencode-auth/auth.json
      # the coder agent works on the real (mounted) repo, so both agents live here
      MNEMOSYNE_DEV_REPO: /repo
    volumes:
      - ./:/repo
      - ./data:/app/data
      - ./vault:/app/vault
      - ./journal:/app/journal
      - ./control:/app/control
      - ./config:/app/config:ro
      # reuse the OpenCode Go token opencode caches after login (read-only)
      - ${HOME}/.local/share/opencode:/opencode-auth:ro
    ports:
      # loopback only: the profile is logged into the agent's Google account and
      # VNC has no password, so never expose these on the network.
      - "127.0.0.1:6080:6080"   # noVNC — human intervention
      - "127.0.0.1:9222:9222"   # Chrome DevTools Protocol
      - "127.0.0.1:8080:8080"   # mnemosyne API (mnemosyne serve)
    restart: unless-stopped
    command: ["mnemosyne", "run"]

# Fixed subnet so a host policy route can force this traffic onto the physical
# NIC (see scripts/check-egress.sh) and off any Tailscale exit node.
networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
