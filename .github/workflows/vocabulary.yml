name: vocabulary

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  nomenclature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Check the vocabulary
        run: python -m pytest tests/test_nomenclature.py -q
